      shrug-vd01-csv/pc01_vd_clean_shrid.csv.zip: 9fad32229b93db35639732c6e1c64489038735e01758e548ce73ba8f3a3f7c95
# Some byte-identical files here are APFS clones (`cp -c`): they share their
# blocks on disk, so each path works normally but the duplicate costs no real
# space. `du` still reports the full size for each -- only `df` shows the saving.
#
# Cloned 2026-08-28: the SHRUG GP crosswalk files that appear both here and in
# quota_representation/data/shrug_gp_xwalk/ (a citable third-party package -- Mahajan 2025,
# CC BY-NC-SA -- kept byte-for-byte as distributed, including its own internal
# repetition across code/, data/ and documentation/).
#
# If a backup restores these as ordinary copies the data is still correct, just
# larger. Re-clone with:  rm dup && cp -c canonical dup
